[package]
name = "lancer-gau"
version = "0.1.0"
edition = "2021"
description = "Rust clone of gau — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-gau"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
async-trait = "0.1"
cuckoofilter = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
url = "2.5"
redb = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
